<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CountDown Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
     <div class="Outer">

        <!-- Heading
        counter Boxs
        Progress 
        Progress Grapf -->

        <div class="Container">

            <h1 id="header_title">CountDown Timer</h1>

            <div id="countDown">
                 
                <div  class="Box"><span id="days"> 00 </span>Days</div>
                <div  class="Box"><span id="hours"> 00 </span> Hours</div>
                <div  class="Box"><span id="mins"> 00 </span> Mins</div>
                <div  class="Box"><span id="sec"> 00 </span> Sec</div>
                
            </div>
             <!-- user input part  -->
            <div id="user-box">
                <label for="Date-input"> Select Date : </label>
                <!-- <input type="datetime-local"   id="Date-input" step="3600" required > -->
                <input type="datetime-local" id="Date-input">
                <button   onclick="timer()"> Start </button>
                <button onclick="stopTimer()">Stop</button>
            </div>
            <!-- <button type="button" value="Start"></button> -->
            <h2>
            Progress Graph :
            </h2>

            <div id="Progress"> 
                <div id="progress-bar"></div>
            </div>
        </div>
        
     </div>
     <script src="index.js"></script>
</body>
</html>
