<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D transition</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            width: 100%;
            height: 100%;
        }

        .container{
           
            height: 100%;
            width: 100%;
            background-color: bisque;
            display: grid;
            gap: 1rem;
            grid-template-columns: repeat(3,1fr);
            
        }
        .item{
            padding: 2rem;
            height: 150px;
            width: 150px;
            background-color: rgb(72, 72, 210);
        }

        #rotatex:hover{

            transform: rotatex(45deg);
        }
        #rotatey:hover{

            transform: rotatey(45deg);
        }
        #rotatez:hover{

            transform: rotatez(45deg);
        }
        #Translatex:hover{

            transform: translateX(100px);
        }

        #TranslateY:hover{

            transform: translateY(100px);
        }

        #TranslateZ:hover{

            transform: perspective(300px) translateZ(100px) rotateY(30deg) ;
        }

       
    </style>
</head>
<body>
     <div class="container">
        <div class="item" id="rotatex">rotatex</div>
        <div class="item" id="rotatey">rotatey</div>
        <div class="item" id="rotatez">rotatez</div>
        <div class="item" id="Translatex">translatex</div>
        <div class="item" id="TranslateY">translateY</div>
        <div class="item" id="TranslateZ">translateZ</div>
        <div class="item" id="scalex" >scalex</div>
        <div class="item" id="scaley" >scaley</div>
        <div class="item" id="scalez">scalez</div>
     </div>
</body>
</html>
