<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            --speed:5s;
        }
        .box{
            height:70vh;
            width: 100vw;
            border: 2px solid black;
            background-color: beige;
            
        }
        
        #box1{
            border: 1px soid black;
            margin: 10px;
            padding: 10px;
            width: 300px;
            height: 50px;
            background-color: blue;
            position: relative;
            border-radius: 100px;
            animation-name: rightmove;
            animation-duration:var(--speed);
            animation-iteration-count: infinite;
            /* animation-fill-mode:both; */
            animation-timing-function: linear;
            animation-direction: alternate;
            /* animation-play-state: running; */
        }
        #box2{
            border: 1px soid black;
            margin: 10px;
            padding: 10px;
            width: 300px;
            height: 50px;
            background-color: blue;
            position: relative;
            border-radius: 100px;
            animation-name: leftmove;
            animation-duration:var(--speed);
            animation-iteration-count: infinite;
            /* animation-fill-mode:both; */
            animation-timing-function: linear;
            animation-direction: alternate-reverse;
            /* animation-play-state: running; */
        }
        #circle{

            border: 1px solid black;
            height: 100px;
            width: 100px;
            background-color: brown;
            border-radius: 100px;
            position: relative;
            animation-name:circle;
            animation-timing-function: linear;
            animation-duration: 5s;
            /* animation-delay: 2s; */
            animation-iteration-count: infinite;
            animation-duration:both;
            animation-direction: alternate;
            /* animation-play-state: running; */

        }
        @keyframes circle{
            0%{
                top: 50px;
                left: 0;
            }
            25%{
               top: 70px;
               left: 1600px;
            }

            50%{
                  top:300px;
               left: 0px;
            }
            100%{
                 top: 400px;
               left: 700px;
            }
        }

        @keyframes rightmove{
            from { top: 0;
                  left: 0; 
            }
            to {top: 0 ;
                left:1600px;}
        }
        @keyframes leftmove{
            from { top: 500px;
                  left: 0; 
            }
            to {top: 500px ;
                left:1600px;}
        }


        
    </style>
</head>
<body>
    <div class="box">
         
         <div id="box1"> box1</div>
         <div id="box2" > LoWer side</div>
         <div id="circle"></div>
    </div>
</body>
</html>
